# Traductions : lib/l10n/app_fr.arb est la référence, app_en.arb sa traduction.
# `flutter pub get` (ou `flutter gen-l10n`) régénère AppLocalizations.
arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
