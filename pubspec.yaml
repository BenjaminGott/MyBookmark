name: biblivre
description: "Suivi de lecture personnel, 100 % local"
publish_to: 'none'

version: 1.5.1+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gestion d'état
  flutter_riverpod: ^3.4.3

  # Base de données locale (drift_flutter embarque sqlite3 3.x et path_provider ;
  # sqlite3_flutter_libs n'est plus nécessaire, il est marqué EOL sur pub.dev)
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  # Référencé directement pour attraper SqliteException et traduire les
  # violations de contrainte en messages français.
  sqlite3: ^3.5.2

  # Réseau (Open Library, sans clé d'API)
  http: ^1.6.0

  # Couvertures distantes, jamais stockées en base
  cached_network_image: ^4.0.0

  # Préférences simples : thème, objectif annuel
  shared_preferences: ^2.5.5

  # Annotations (@immutable) pour la couche domain, sans dépendre de Flutter
  meta: ^1.16.0

  # Choix du fichier d'export et d'import JSON
  file_picker: ^13.1.0

  # Partage d'une carte de progression
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  # 0.3.3+7 (mai 2025) : maintenance minimale, mais paquet officiel
  # flutter/packages, et il fait exactement le travail attendu.
  palette_generator: ^0.3.3+7

  # Formatage des dates selon la langue
  intl: ^0.20.2 # épinglé à 0.20.2 par flutter_localizations
  gal: ^2.3.3

  # Liens de l'écran « À propos » : e-mail, Google Play, site
  url_launcher: ^6.3.2

  # Scanner le code-barres d'un livre : zxing, décodé sur le téléphone, sans
  # service Google
  flutter_zxing: ^3.1.0

  # Widget d'écran d'accueil (livre en cours)
  home_widget: ^0.10.0

  # Fenêtre « Noter l'application » de Google Play, sans quitter l'app
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Génération du code drift
  drift_dev: ^2.35.0
  build_runner: ^2.15.1 # 2.16.x exige meta >=1.18.3, incompatible avec Flutter 3.44.4

flutter:
  uses-material-design: true
  # Génère AppLocalizations depuis lib/l10n (voir l10n.yaml).
  generate: true

  # Le logo de l'en-tête, produit par tool/generate_icons.py.
  assets:
    - assets/logo.png
