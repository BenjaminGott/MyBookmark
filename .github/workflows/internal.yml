# Test interne : à chaque push sur `dev`, l'app est testée, compilée et envoyée
# sur la piste « Test interne » du Play Store. Les testeurs la reçoivent en
# quelques minutes, sans examen de Google.
name: Test interne

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Un seul envoi à la fois : un push plus récent annule celui en cours.
concurrency:
  group: internal
  cancel-in-progress: true

jobs:
  internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installe la clé de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test

      # Le nom de version prend un suffixe « -dev.N » : dans les paramètres
      # Android, on voit tout de suite qu'il s'agit d'une version de test.
      - name: Compile l'AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          flutter build appbundle --release \
            --build-name "${name}-dev.${GITHUB_RUN_NUMBER}" \
            --build-number "$(tool/ci/build_number.sh)"

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.libergot.mybookmark
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          # « draft » tant que l'app n'a jamais été publiée (voir le guide).
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
