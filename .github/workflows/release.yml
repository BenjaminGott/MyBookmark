# Production : à chaque push sur `main`, l'app est testée, compilée, publiée
# en release GitHub (APK + AAB) et envoyée sur la piste « Production » du Play
# Store, où Google l'examine avant de la proposer à tout le monde.
#
# Le tag vient de la version de pubspec.yaml (`v1.4.0`). S'il existe déjà, le
# numéro de compilation lui est ajouté (`v1.4.0-123456`) : changer la version
# dans pubspec.yaml reste conseillé pour chaque nouveauté visible.
#
# Un tag `v*` poussé à la main, ou un lancement depuis l'onglet Actions,
# fonctionne aussi.
name: Production

on:
  push:
    branches: [main]
    tags: ['v*']
    # Un changement qui ne touche pas l'app (workflows, docs) ne publie rien.
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
      - 'tool/ci/play_publish.py'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex. v1.5.0), vide = version de pubspec.yaml'
        required: false

# Jamais deux envois en même temps, et jamais d'envoi interrompu à mi-chemin.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choisit le tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              tag="$tag-$(tool/ci/build_number.sh)"
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Tag : $tag"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Le code natif du scanner (zxing, en C++, pour trois processeurs) est
      # le plus long de la compilation : ccache garde les fichiers déjà
      # compilés d'une fois sur l'autre. Le NDK est redécompressé à chaque
      # fois : le compilateur est reconnu à son contenu, pas à sa date.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-native-${{ github.workflow }}
          max-size: 2G

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # La clé de release vient des secrets du dépôt : toutes les versions
      # publiées sont signées pareil, et se mettent donc à jour entre elles.
      - name: Installe la clé de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : pas de release sans la clé."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Le runner GitHub a 16 Go : Gradle limité à 4 Go (le projet en demande
      # 8), pour laisser de la place à Kotlin et à la compilation native du
      # scanner. Sans cela, la machine s'arrête en pleine compilation.
      - name: Limite la mémoire de Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' > ~/.gradle/gradle.properties

      - run: flutter pub get
      - run: flutter test

      # L'AAB d'abord, le format exigé par le Play Store : il part avant tout le
      # reste.
      - name: Compile l'AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          number=$(tool/ci/build_number.sh)
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          flutter build appbundle --release --build-number "$number"
          cp build/app/outputs/bundle/release/app-release.aab "mybookmark-${TAG}.aab"

      # La piste peut être changée dans les variables du dépôt (PLAY_TRACK),
      # par exemple « alpha » pour repasser par le test fermé.
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.libergot.mybookmark
          releaseFiles: mybookmark-${{ env.TAG }}.aab
          releaseName: ${{ env.TAG }}
          track: ${{ vars.PLAY_TRACK || 'production' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      # Puis l'APK, à installer directement, signé avec la même clé. Gradle est
      # arrêté entre les deux pour repartir avec toute la mémoire.
      - name: Compile l'APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          (cd android && ./gradlew --stop) || true
          flutter build apk --release --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "mybookmark-${TAG}.apk"

      # Bonus : l'app est déjà sur le Play Store à ce stade, une release GitHub
      # refusée ne doit pas faire passer l'envoi pour un échec.
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            mybookmark-*.apk
            mybookmark-*.aab
          generate_release_notes: true
