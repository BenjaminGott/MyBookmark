# Production : à chaque push sur `main`, l'app est testée, compilée, publiée
# en release GitHub (APK + AAB) et envoyée sur la piste « Production » du Play
# Store, où Google l'examine avant de la proposer à tout le monde.
#
# Le tag vient de la version de pubspec.yaml (`v1.4.0`). S'il existe déjà, le
# numéro de compilation lui est ajouté (`v1.4.0-123456`) : changer la version
# dans pubspec.yaml reste conseillé pour chaque nouveauté visible.
#
# Un tag `v*` poussé à la main, ou un lancement depuis l'onglet Actions,
# fonctionne aussi.
name: Production

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex. v1.5.0), vide = version de pubspec.yaml'
        required: false

# Jamais deux envois en même temps, et jamais d'envoi interrompu à mi-chemin.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choisit le tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              tag="$tag-$(tool/ci/build_number.sh)"
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Tag : $tag"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # La clé de release vient des secrets du dépôt : toutes les versions
      # publiées sont signées pareil, et se mettent donc à jour entre elles.
      - name: Installe la clé de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : pas de release sans la clé."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test
      # L'APK s'installe directement ; l'AAB est le format exigé par le Play
      # Store. Les deux sont signés avec la même clé.
      - name: Compile l'APK et l'AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          number=$(tool/ci/build_number.sh)
          flutter build apk --release --build-number "$number"
          flutter build appbundle --release --build-number "$number"

      - name: Nomme les fichiers d'après le tag
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "mybookmark-${TAG}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "mybookmark-${TAG}.aab"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            mybookmark-*.apk
            mybookmark-*.aab
          generate_release_notes: true

      # La piste peut être changée dans les variables du dépôt (PLAY_TRACK),
      # par exemple « alpha » pour repasser par le test fermé.
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.libergot.mybookmark
          releaseFiles: mybookmark-${{ env.TAG }}.aab
          releaseName: ${{ env.TAG }}
          track: ${{ vars.PLAY_TRACK || 'production' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
