# Publie une release GitHub avec l'APK à chaque tag `v*` (ex. `v1.1.0`).
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Nomme l'APK d'après le tag
        run: cp build/app/outputs/flutter-apk/app-release.apk "biblivre-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: biblivre-*.apk
          generate_release_notes: true
