# Production : à chaque push sur `main`, l'app est testée, compilée et envoyée
# sur la piste « Production » du Play Store, où Google l'examine avant de la
# proposer à tout le monde. Le nom de la version vient de pubspec.yaml.
#
# Se lance aussi à la main depuis l'onglet Actions.
name: Production

on:
  push:
    branches: [main]
    # Un changement qui ne touche pas l'app (workflows, docs) ne publie rien.
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
      - 'tool/ci/play_publish.py'
  workflow_dispatch:

# Jamais deux envois en même temps, et jamais d'envoi interrompu à mi-chemin.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Le code natif du scanner (zxing, en C++, pour trois processeurs) est
      # le plus long de la compilation : ccache garde les fichiers déjà
      # compilés d'une fois sur l'autre. Le NDK est redécompressé à chaque
      # fois : le compilateur est reconnu à son contenu, pas à sa date.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-native-${{ github.workflow }}
          max-size: 2G

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # La clé de release vient des secrets du dépôt : toutes les versions
      # publiées sont signées pareil, et se mettent donc à jour entre elles.
      - name: Installe la clé de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : pas de release sans la clé."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Le runner GitHub a 16 Go : Gradle limité à 4 Go (le projet en demande
      # 8), pour laisser de la place à Kotlin et à la compilation native du
      # scanner. Sans cela, la machine s'arrête en pleine compilation.
      - name: Limite la mémoire de Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' > ~/.gradle/gradle.properties

      - run: flutter pub get
      - run: flutter test

      # L'AAB, le format exigé par le Play Store.
      - name: Compile l'AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "VERSION_NAME=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
          flutter build appbundle --release --build-number "$(tool/ci/build_number.sh)"

      # La piste peut être changée dans les variables du dépôt (PLAY_TRACK),
      # par exemple « alpha » pour repasser par le test fermé.
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.libergot.mybookmark
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.VERSION_NAME }}
          track: ${{ vars.PLAY_TRACK || 'production' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
